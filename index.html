<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diamond Inclusion Database</title>
<meta name="description" content="Project documents for a traceable database of mineral inclusions in diamonds.">
<!-- Renders the repo's own Markdown in the browser, so the docs stay the single source. -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #fbfbf9; --panel: #f2f1ec; --text: #1d1d1b; --muted: #66655f;
    --line: #dddbd3; --accent: #2f5d8a; --code: #eeede7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --panel: #1f1f1d; --text: #e8e6df; --muted: #9b998f;
      --line: #34332f; --accent: #8db7e0; --code: #262624;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
  nav {
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 24px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  nav .title { font-weight: 650; line-height: 1.3; margin: 0 8px 20px; }
  nav .title span { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
  nav a {
    display: block; padding: 6px 8px; border-radius: 6px;
    color: var(--text); text-decoration: none; font-size: 15px;
  }
  nav a:hover { background: var(--line); }
  nav a.active { background: var(--accent); color: var(--bg); }
  nav .group { margin: 16px 8px 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  main { padding: 40px 48px 80px; max-width: 920px; }
  .path { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  h1 { font-size: 30px; line-height: 1.25; margin: 0 0 16px; }
  h2 { font-size: 22px; margin: 36px 0 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  h3 { font-size: 18px; margin: 24px 0 8px; }
  a { color: var(--accent); }
  blockquote { margin: 16px 0; padding: 4px 16px; border-left: 3px solid var(--accent); color: var(--muted); }
  code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
  pre { background: var(--code); padding: 16px; border-radius: 8px; overflow-x: auto; font-size: 13px; line-height: 1.5; }
  pre code { background: none; padding: 0; }
  .table-wrap { overflow-x: auto; margin: 16px 0; }
  table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
  th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  th { background: var(--panel); }
  li input[type=checkbox] { margin-right: 6px; }
  .error { color: #b3261e; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; }
    nav .links { display: flex; flex-wrap: wrap; gap: 4px; }
    nav .group { display: none; }
    main { padding: 24px 16px 60px; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav>
    <div class="title">Diamond Inclusion Database<span>Project documents</span></div>
    <div class="links">
      <a href="#/README.md">Overview</a>
      <div class="group">Plan</div>
      <a href="#/docs/brief.md">Brief</a>
      <a href="#/docs/roadmap.md">Roadmap</a>
      <a href="#/docs/log.md">Progress log</a>
      <a href="#/docs/inputs-needed.md">Inputs and seed papers</a>
      <div class="group">Design</div>
      <a href="#/docs/decisions/README.md">Decisions</a>
      <a href="#/docs/compilations-mapping.md">Compilations mapping</a>
      <a href="#/schema/001_core.sql">Schema (SQL)</a>
    </div>
  </nav>
  <main><div class="path" id="path"></div><article id="doc">Loading…</article></main>
</div>
<script>
const doc = document.getElementById("doc");
const pathEl = document.getElementById("path");

function currentPath() {
  let p = decodeURIComponent(location.hash.replace(/^#\/?/, "")).split("#")[0] || "README.md";
  if (p.endsWith("/")) p += "README.md";
  return p;
}

// Turn a link written relative to one doc into an in-site route.
function route(href, from) {
  if (/^[a-z]+:|^#|^\/\//i.test(href)) return null;
  const url = new URL(href, "https://site/" + from);
  let p = url.pathname.slice(1);
  if (p.endsWith("/")) p += "README.md";
  return "#/" + p + url.hash;
}

async function show() {
  const path = currentPath();
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#/" + path));
  pathEl.textContent = path;
  try {
    const res = await fetch(path);
    if (!res.ok) throw new Error(res.status + " " + res.statusText);
    const text = await res.text();
    if (path.endsWith(".md")) {
      doc.innerHTML = marked.parse(text.replace(/^---\n[\s\S]*?\n---\n/, ""), { gfm: true });
    } else {
      doc.innerHTML = "<h1></h1><pre><code></code></pre>";
      doc.querySelector("h1").textContent = path.split("/").pop();
      doc.querySelector("code").textContent = text;
    }
    doc.querySelectorAll("a[href]").forEach(a => {
      const r = route(a.getAttribute("href"), path);
      if (r) a.setAttribute("href", r);
      else if (/^https?:/.test(a.href)) a.target = "_blank";
    });
    doc.querySelectorAll("table").forEach(t => {
      const wrap = document.createElement("div");
      wrap.className = "table-wrap";
      t.replaceWith(wrap);
      wrap.appendChild(t);
    });
    const h1 = doc.querySelector("h1");
    document.title = (h1 ? h1.textContent + " · " : "") + "Diamond Inclusion Database";
  } catch (e) {
    doc.innerHTML = '<p class="error"></p>';
    doc.firstChild.textContent = "Could not load " + path + " (" + e.message + ").";
  }
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", show);
show();
</script>
</body>
</html>
